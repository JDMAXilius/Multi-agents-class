; 3 Aug 2026 (BP78): the ONE line that engages UBRGameUserSettings. Without it
; GEngine->GetGameUserSettings() returns a plain UGameUserSettings, every Cast in
; UBRGameUserSettings::Get() returns null, and the whole settings tree builds with unbound
