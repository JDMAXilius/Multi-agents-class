; 1 Aug 2026 (BP18): CommonUI is an enabled plugin (Breachpoint.uproject) and its input router
; REQUIRES a CommonGameViewportClient-derived viewport client. Without this line every PIE run
; logs, as an Error, not a warning:
;   LogUIActionRouter: Error: Using CommonUI without a CommonGameViewportClient derived game
;   viewport client. CommonUI Input routing will not function correctly.
; UIActionRouter sits in front of the player controller, so a wrong viewport client can swallow
; gameplay input before Enhanced Input ever sees it -- the failure looks like "the keys do
; nothing" while every binding logs as successfully bound, which is exactly what BP18 hit.
GameViewportClientClassName=/Script/CommonUI.CommonGameViewportClient

; Template lineage: TP_FirstPerson -> breachpoint -> Breachpoint. The OldGameName side of a
