; NewMoons project and its parent class is /Script/NewMoons.NMAnimInstance. There is no
; NewMoons module here, so the editor cannot build the generated class and refuses the
; asset with "The Anim Blueprint could not be loaded because it is corrupt." The package
; is NOT corrupt - it is 1.84 MB of real, LFS-materialised data with one unresolvable
; super. This redirect supplies the missing super at load time.
