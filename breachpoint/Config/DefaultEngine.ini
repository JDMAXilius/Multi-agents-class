; !! THIS SECTION IS INERT. DO NOT TRUST IT, AND DO NOT ADD TO IT. !!
;
; Verified 1 Aug 2026 against the engine source. It fails for two independent reasons:
;   1. AGameModeBase::DefaultPawnClass and ::PlayerControllerClass are declared
;      EditAnywhere/BlueprintRead* with NO `Config` specifier (GameModeBase.h:95-96 and
;      :107-108). UE only fills a property from a [/Script/Module.Class] section when the
;      UPROPERTY carries `Config`. No specifier, no read - in any ini file.
;   2. AGameModeBase is UCLASS(config = Game) (GameModeBase.h:46), so even a properly
;      specified property would be read from DefaultGame.ini, not from this file.
;
; CONSEQUENCE, and it is the reason "the template moves and ours does not" was possible:
; the ONLY thing that decides which pawn and which controller spawn is GM_BR's own
; Blueprint details panel. These four lines have never influenced a single PIE session.
; Changing the pawn/controller is an editor edit on /Game/Core/GM_BR, or a C++ constructor
; assignment in ABRGameMode - not an ini edit.
;
; Left in place, loudly annotated, rather than deleted: a reader who finds the section
; missing will add it back. GameStateClass is set in ABRGameMode's constructor and works.

[/Script/Breachpoint.BRGameMode]
DefaultPawnClass=/Script/Breachpoint.BRCharacter
PlayerControllerClass=/Script/Breachpoint.BRPlayerController
PlayerStateClass=/Script/Breachpoint.BRPlayerState
GameStateClass=/Script/Breachpoint.BRGameState
