; ---------------------------------------------------------------------------------------
; Physical surfaces. Added 8 Aug 2026 (BP82) - the project declared NONE, which is why every
; `Switch on EPhysicalSurface` node reported its named pins as no longer existing:
;   "In use pin Character no longer exists on node Switch on EPhysicalSurface"
;   ...and the same for Concrete and Glass.
;
; THE ORDER IS LOAD-BEARING AND WAS RECOVERED, NOT CHOSEN. A material stores the raw enum
; value (SurfaceType1..62); config supplies only the LABEL. So naming them in the wrong order
; does not fail - it silently redefines what every existing material means, which is the worst
; possible outcome and leaves no error behind.
;
; The mapping was read out of the template's own physical materials rather than guessed:
;   Content/FPSTemplate/Demo/PhysicsMaterials/PM_Character.uasset -> SurfaceType1
;   Content/FPSTemplate/Demo/PhysicsMaterials/PM_Concrete.uasset  -> SurfaceType2
;   Content/FPSTemplate/Demo/PhysicsMaterials/PM_Glass.uasset     -> SurfaceType3
; which is also the order the compiler listed the missing pins in - two independent sources
; agreeing. Adding a NEW surface appends SurfaceType4 and never renumbers these three.
[/Script/Engine.PhysicsSettings]
+PhysicalSurfaces=(Type=SurfaceType1,Name="Character")
+PhysicalSurfaces=(Type=SurfaceType2,Name="Concrete")
+PhysicalSurfaces=(Type=SurfaceType3,Name="Glass")

; ---------------------------------------------------------------------------------------
; UI SCALING — the 1280x720 grid is the design resolution, not a fixed pixel canvas.
;
; Every measured number in the HUD (and in Content/UI, whose own wireframe says "measured
; from 1920x1080 capture / 1.5") is authored against 1280x720. The ENGINE DEFAULT curve maps
; 1080 -> 1.0 and 720 -> 0.666, so a widget authored at 720p renders at two-thirds size on a
; 720p window and at native pixels on a 1080p one -- i.e. it shrinks as the window grows.
;
; This curve is simply Scale = ShortestSide / 720: the design grid IS 1:1 at 720p and scales
; linearly with the window from there. Combined with real anchors on the HUD canvas (each
; surface pinned to the edge it belongs to, not to 0,0), the HUD covers whatever window is
; playing at any resolution or aspect.
;
; PROJECT-WIDE by nature: it also rescales /Game/UI. That is the intent -- both UIs were
; measured on the same grid. Delete this section to fall back to the engine default.
[/Script/Engine.UserInterfaceSettings]
UIScaleRule=ShortestSide
UIScaleCurve=(EditorCurveData=(Keys=((Time=0.000000,Value=0.000000,InterpMode=RCIM_Linear),(Time=720.000000,Value=1.000000,InterpMode=RCIM_Linear),(Time=1080.000000,Value=1.500000,InterpMode=RCIM_Linear),(Time=2160.000000,Value=3.000000,InterpMode=RCIM_Linear))),ExternalCurve=None)

[/Script/NavigationSystem.RecastNavMesh]
; TRAVERSAL (BN13). Bots derive drop-down and jump-up from the navmesh itself; nothing is placed
; in the level but the BR_NavBounds volume that is already there.
;
; The numbers are MEASURED off ABNCharacter's movement component, not chosen:
;   JumpZVelocity 420, GravityScale 1  ->  apex = 420^2 / (2*980) = 90uu
;   air time 0.86s at MaxWalkSpeed 600 ->  flat-to-flat reach ~514uu
;   MaxStepHeight 45                   ->  anything under 45uu is walked, no link needed
;   no fall damage anywhere in BN      ->  descending is free at any height
; So the useful jump-UP band is only 45..90uu. Climb links are deliberately tight; drop links
; are deliberately generous, because the two directions cost the bot completely different things.
bGenerateNavLinks=True

; AIB9, 26 Aug 2026 — JumpMaxDepth 800 -> 1000. MEASURED, not guessed: 80,237 move
; refusals in one match, 97% of them with the goal BELOW the bot, median 785uu down, and
; a hard cluster of 28,465 at ~880uu. The top tier stands at z=805 and a capsule centre
; rides ~88uu above its feet, so leaving that platform for the ground floor needs ~880uu
; of drop against an 800 cap — no link generated, bots stranded on the roof. This is the
; founder's oldest standing complaint ("they start on the top platform and cannot fall to
; the others"), finally with a number on it.
;
; HONEST, unlike raising the climb: this file already records that BN has NO FALL DAMAGE,
; so descending is free at any height and a link at 1000 promises only what a player can
; already do by walking off the edge. Raising JumpHeight would be the opposite — a
; promise the body cannot keep — and is NOT what changed here.
;
; Does NOT explain everything: 26,387 failures sit in the 300-499uu band, well inside the
; old cap, and are still unexplained. Fixing the half that is proven, and saying so.
; DOWN ONLY. UpDirectionAreaClass=None suppresses the up link (header: "If the value is null, no
; link will be generated in this direction").
;
; JumpLength 400 sits under the measured 514 so the generator cannot promise a gap the bot
; cannot clear.
;
; AIB8 TESTED 600 AND REVERTED IT. Sprint reach is really 617uu (600 * 1.2 sprint * 0.857s air),
; and three measured stuck goals sat just under it, so 600 looked like the reach-limited fix.
; It was not. Refusals went 30 -> 8515, distinct stuck distances 6 -> 1337, median 615 -> 1112uu,
; max 771 -> 2651uu: the failures stopped being six specific spots and became everywhere, at
; ranges no jump was ever going to serve. A longer link did not add reach, it degraded the mesh.
;
; The tell is in the build log. BorderForLinks scales with JumpLength -- 23 vx at 400, 34 vx at
; 600 -- and BOTH exceed the tileSize the builder reports (0 vx). Widening the link border against
; a degenerate tile size is what got worse, so the next thing to investigate is the recast TILE
; configuration (TileSizeUU / CellSize are unset project-wide, so they are engine defaults), NOT
; this number. Do not raise it again without fixing that first.
+NavLinkJumpConfigs=(bEnabled=True,Name="BN_Drop",JumpLength=400.000000,JumpDistanceFromEdge=10.000000,JumpMaxDepth=1000.000000,JumpHeight=50.000000,JumpEndsHeightTolerance=80.000000,SamplingSeparationFactor=1.000000,FilterDistanceThreshold=80.000000,DownDirectionAreaClass="/Script/NavigationSystem.NavArea_Default",UpDirectionAreaClass=None)

; UP ONLY, and tight. A NEGATIVE JumpMaxDepth is how the engine expresses "land above the start"
; (header, and JumpHeight is ClampMin=0 AND hard-asserted at DetourNavLinkBuilderConfig.cpp:8, so
; the negative must go here and never there). -70 keeps 20uu of margin under the 90uu apex for the
; ledge lip and for AirControl 0.5. JumpHeight 90 is the real apex and exceeds |depth|, which the
; header requires. Tolerance is halved so the sampler cannot accept a ledge above reach.
+NavLinkJumpConfigs=(bEnabled=True,Name="BN_Climb",JumpLength=250.000000,JumpDistanceFromEdge=10.000000,JumpMaxDepth=-70.000000,JumpHeight=90.000000,JumpEndsHeightTolerance=40.000000,SamplingSeparationFactor=1.000000,FilterDistanceThreshold=80.000000,DownDirectionAreaClass=None,UpDirectionAreaClass="/Script/NavigationSystem.NavArea_Default")
