; R4 — the match. Every number the free-for-all runs on, in one place: changing the length or
; the target of a match is an ini edit, never a rebuild. MinPlayers=1 so a solo PIE session always
; starts a match rather than sitting in warmup forever.
; TESTING, 22 Aug 2026 — 3 so a round ends in a kill or two and the win/lose screens are
; actually reachable. Ship value was 25; this is the line to put back, not the C++ default.
; 3 -> 7 (founder, 25 Aug). With 8 players and Spartan bots a round of 3 ended almost
; immediately - 10 eliminations were logged in a single 55s sample.
; AIB11 (Phase 6 Hill proof, 26 Aug 2026). ScoreLimit was raised 7 -> 25 for the hill runs
; and RESTORED to 7 here; bHillEnabled is back to False (slayer is the shipped default).
; To re-run the objective proof: set the bHillEnabled line below to True and raise
; ScoreLimit. NOTE the trap that already bit once — a sed/replace on the bare string
; matches THIS COMMENT first; anchor any scripted edit to the start of a line.
ScoreLimit=7
TimeLimit=600
MinPlayers=1

; THE HILL, placed ON a PlayerStart — (2000,1300,405), the mid-platform spawn.
;
; First attempt put it 300uu away at (2000,1600,430), reasoning that a spawn nearby proved
; navmesh coverage. It does not, and the match said so: zero no-POI failures (the POI was
; there) but 31 "cannot reach the objective" per bot. The move already projects onto the
; navmesh (AIB5's helper covers this task), so that was genuine UNREACHABILITY — the AIB9
; defect, on an arena whose islands the bots cannot cross.
;
; ON the spawn is the only placement that PROVES reachability instead of inferring it: a
; body stands there every respawn. Bots start inside the radius, which is fine for a proof
; of "does the objective loop work at all" and wrong for a balance read — noted, not hidden.
bHillEnabled=False
HillLocation=(X=2000.0,Y=1300.0,Z=405.0)
HillRadius=600.0
HillPointsPerSecond=1
; TEAMS (BN15). False is FFA byte-for-byte — nobody is assigned and every team path is inert.
; FOUNDER RULING, 27 Aug 2026: TEAMS IS THE DEFAULT ("the default should be the Teams —
; we're only gonna be working with Teams, at least for now, for testing"). This ruling
; KNOWINGLY overrides the 26 Aug measured revert (teams ON collapsed activity 12 kills/461
; switches vs 38/1329 FFA — halved target density on a hard-to-traverse arena, recorded in
; commit 95c72cb): the founder chooses to develop against the teams configuration and fix
; the density problem (traversal + team play) rather than develop against FFA. Flip to
; False for an FFA comparison run; the ruling, not the collapse, decides the default.
bTeamsEnabled=True
; Read only when teams are on; the damage door consults it. Self-damage is always allowed.
bFriendlyFire=False
