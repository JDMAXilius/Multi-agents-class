; R5 — THE TREE. ST_BNBot is the editor ticket (TASK-R5-ST-BNBOT); the controller resolves this
; soft path in OnPossess and hands it to the StateTree component, so no Blueprint child of
; ABNBotController has to exist just to hold one asset reference. Until the asset is built this
; resolves null and every bot logs ONE "BotStateTree ... failed to load" warning and stands still
; — the designed miss answer, loud, not a crash.
[/Script/BreachpointNext.BNBotController]
BotStateTree=/Game/BN/AI/ST_BNBot.ST_BNBot

; R10 — THE TIER. Recruit | Marine | ODST | Spartan, and it is the only bot-skill key now:
; sight, reaction, aim and the jump/strafe rhythm all moved onto the tier row, because a
; difficulty setting that cannot change them is not one, and keeping both would be two sources
; of truth for one number. An unknown name warns once and falls back to Marine.
;
; MARINE IS THE FOUNDER'S SIGHT TUNING, kept exactly: 1200/1500/70, lowered from the engine
; defaults (2500/3000) because at those numbers a bot could see most of BR_Arena01 from where it
; stood — every bot always had a target, the tree never left Engage, Search was unreachable and
; nobody roamed. Every other tier is scaled around THOSE numbers, not around the old defaults:
; a tier that sees the whole map is not a harder bot, it is that bug again.
; Founder, 25 Aug: "make them way more agresive and persintance with targets and tacktics".
; ODST rather than pumping Marine's numbers: the ladder already encodes what a harder bot is
; (react 0.14-0.28 vs 0.22-0.45, aim 1.4 vs 2.5, strafe 0.8 vs 1.0, sight 1500 vs 1200), and
; flattening Marine into ODST would delete the difficulty system to get one difficulty.
; Sight 1500 is inside the designed scaling; the bug that must never come back is 2500/3000.
BotTier=Spartan

; R2 G2 - the weapons every player carries. ROW NAMES, not classes: the row is the weapon's
; identity and carries its mesh, attach socket, anim layer and ability set, so one C++
; ABNWeapon serves every entry. Spawned server-side by UBNEquipmentComponent at possession;
; list order is switch order and index 0 is equipped on spawn.
;
; Unarmed is a null slot (no actor). The other four names must exist in DT_BNWeapons.
[/Script/BreachpointNext.BNEquipmentComponent]
+StartupWeaponRows=Unarmed
+StartupWeaponRows=Pistol
+StartupWeaponRows=Rifle
+StartupWeaponRows=Shotgun
+StartupWeaponRows=Knife

; Empty-hand punch when the Unarmed slot is equipped and no Unarmed DT row exists.
; Closest template montage — FPSTemplate ships no dedicated unarmed punch.
[/Script/BreachpointNext.BNGA_Melee]
UnarmedMeleeMontage=/Game/FPSTemplate/Demo/Characters/Heroes/Mannequin/Animations/Actions/AM_MM_Pistol_Melee.AM_MM_Pistol_Melee
UnarmedMeleeDamage=40.0
UnarmedMeleeRange=120.0

; R3 FX — the cue wiring, all template assets, per the founder's Config ruling. The cues now
; speak the template's own contracts (read from BPC_FPST_Lyra_FireEffectComp's graphs): the
; tracer takes User.ImpactPositions[] + User.Trigger; the impact spawns the shared decal system
; plus a per-surface burst + sound, fallback = the concrete Effect line (the template's own
; fallback row). Cues still degrade silently on any unset line.
; GrenadeClass is deliberately UNSET — the ability defaults to ABNProjectile, BN's own C++ grenade.
; It is NOT BP_FPST_Grenade: a Blueprint grenade explodes through ApplyRadialDamage, which purity
; law 3 bans outright, and that would be a second damage pipeline bypassing attributes, shields and
; death. ABNProjectile still wears the template's art.
;
; ThrowMontage: I recorded this as "not identified" twice. It was there the whole time — the
; template ships AM_MM_Rifle_GrenadeToss under the CHARACTER's Actions folder, not under a grenade
; folder, which is why looking beside BP_FPST_Grenade found nothing. Rifle-named but character-
; owned, so it plays whatever is in hand.
[/Script/BreachpointNext.BNGA_Grenade]
ThrowMontage=/Game/FPSTemplate/Demo/Characters/Heroes/Mannequin/Animations/Actions/AM_MM_Rifle_GrenadeToss.AM_MM_Rifle_GrenadeToss

; The C++ grenade's tuning and its borrowed art. Radial damage here is an overlap query plus one
; GE per survivor — the contract's own prescription for radial, not the engine's.
[/Script/BreachpointNext.BNProjectile]
FuseTime=3.0
LaunchSpeed=1600.0
Damage=90.0
InnerRadius=150.0
Radius=500.0
bRequireLineOfSight=True
Bounciness=0.3
Mesh=/Game/FPSTemplate/Demo/Weapons/Grenade/Mesh/SM_grenade.SM_grenade
TrailEffect=/Game/FPSTemplate/Effects/Particles/Explosion/NS_Grenade_Trail.NS_Grenade_Trail

