; ---------------------------------------------------------------------------
; BRPlayerController input soft refs (law 3 / R26: prefer ini over BP details).
;
; THIS SECTION WAS INERT UNTIL 1 Aug 2026 AND THAT WAS THE BUG. UE only fills a property
; from a [/Script/Module.Class] section when the UPROPERTY carries the `Config` specifier
; and the UCLASS is declared `config=Game`. ABRPlayerController had neither, so every line
; below was read by nobody: DefaultMappingContext and InputConfig fell back to whatever
; PC_BR's details panel happened to hold, and MouseLookAction / AdditionalMappingContexts
; — properties PC_BR predates and therefore does not serialise — stayed NULL. Both
; specifiers are now present; see BRPlayerController.h.
;
; IMC_MouseLook is the Shooter-template second context and is NOT optional here:
; IMC_Default carries no Mouse2D/MouseX mapping at all, so without this line the player
; cannot turn. Move/Jump/Crouch/abilities are on IMC_Default.
;
; Paths are full object paths (Package.Object), which is what a TSoftObjectPtr parses.
; ---------------------------------------------------------------------------
[/Script/Breachpoint.BRPlayerController]
InputConfig=/Game/Input/DA_InputConfig.DA_InputConfig
DefaultMappingContext=/Game/Input/IMC_Default.IMC_Default
+AdditionalMappingContexts=/Game/Input/IMC_MouseLook.IMC_MouseLook
MouseLookAction=/Game/Input/Actions/IA_MouseLook.IA_MouseLook
DefaultMappingContextPriority=0

; ---------------------------------------------------------------------------
; PHASE 1 BASELINE — ABRCharacter's four native verbs, pinned directly.
;
; WHAT THIS IS: the Shooter template's binding shape (the pawn names its own actions)
; expressed lawfully — soft refs pinned from ini, not the template's hard UInputAction*
; UPROPERTYs filled in from a Blueprint details panel. It takes DA_InputConfig's row
; lookup and tag matching out of the WASD failure path, so Phase 1 can prove
; IMC -> UInputAction -> pawn -> CMC end to end with the fewest links that can break.
;
; HOW PHASE 2 UNDOES IT: set bBindNativeVerbsFromInputConfig=True below. That is the
; whole change — no recompile, both code paths always compiled. Keep these five pins in
; place while testing so the fallback still exists, then delete this block once the
; config path is proven. Ordered plan: docs/PHASE2-RELAYER.md.
; ---------------------------------------------------------------------------
[/Script/Breachpoint.BRCharacter]
MoveAction=/Game/Input/Actions/IA_Move.IA_Move
LookAction=/Game/Input/Actions/IA_Look.IA_Look
MouseLookAction=/Game/Input/Actions/IA_MouseLook.IA_MouseLook
JumpAction=/Game/Input/Actions/IA_Jump.IA_Jump
CrouchAction=/Game/Input/Actions/IA_Crouch.IA_Crouch
bBindNativeVerbsFromInputConfig=False
