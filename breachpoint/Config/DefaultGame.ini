bFriendlyFire=False
; FOUNDER, 29 Aug: "after the match ends it gets reset in 5 seconds."
;
; This replaces a TESTING value — 45 was set on 22 Aug so the win/lose screen was watchable,
; with its own note saying "ship value was 10; put it back". It never went back, so every
; match since has sat on a dead screen for three quarters of a minute.
;
; 5 is deliberately shorter than that original 10, and the trade is worth stating: the
; win/lose screen gets five seconds, which is a glance rather than a read. If the outcome
