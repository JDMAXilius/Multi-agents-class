; The ability set granted to every player on possession, server side. Soft path, resolved by
; ABRPlayerState::GiveStartupLoadout. Without this line a player is granted nothing and every
; ability input reaches an ASC with no matching spec.
[/Script/Breachpoint.BRPlayerState]
StartupAbilitySet=/Game/Abilities/DA_AbilitySet_Core.DA_AbilitySet_Core

; Ability verb actions bound by ABRPlayerController::SetupInputComponent. Config rather than
; only EditAnywhere so a fresh PC_BR needs no details-panel pass; a value serialised on the
; Blueprint still wins over these, since LoadConfig runs before the BP's own serialisation.
[/Script/Breachpoint.BRPlayerController]
JumpAction=/Game/Input/Actions/IA_Jump.IA_Jump
FireAction=/Game/Input/Actions/IA_Fire.IA_Fire
ReloadAction=/Game/Input/Actions/IA_Reload.IA_Reload
SwapAction=/Game/Input/Actions/IA_Swap.IA_Swap
GrenadeAction=/Game/Input/Actions/IA_Grenade.IA_Grenade
