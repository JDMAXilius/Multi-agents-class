; BP82 - the animation spine's asset bindings.
;
; These two lines are the ONLY place an animation asset is named for the character, and that
; is deliberate: law 3 and rework governing idea 5 both forbid C++ from naming an asset, and
; Variant_Shooter was deleted for hard-referencing an AnimInstance class per weapon.
; ABRFPSCharacter resolves these SOFT class refs in BeginPlay, so the ABP is loaded on demand
; and no header mentions it.
;
; The `_C` suffix is required - a TSoftClassPtr resolves the generated CLASS, not the asset.
; Without it the load silently returns null and both meshes T-pose.
;
; NOTE, 9 Aug 2026: both ABPs are 34 KB class stubs - no state machine, no ALI_ItemAnimLayers
; interface - so anything parented to ABRFPSCharacter T-poses in PIE. Not a config defect and
; not fixable here: BeginPlay assigns these correctly and the assets have no graph to play.
; See the BP82 Log entry "the T-pose after reparenting to ABRFPSCharacter, diagnosed".
[/Script/Breachpoint.BRFPSCharacter]
