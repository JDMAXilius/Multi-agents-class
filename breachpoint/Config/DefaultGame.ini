; ---------------------------------------------------------------------------
; BRPlayerController input soft refs.
;
; THESE PINS ARE NO LONGER LOAD-BEARING, AND THAT IS THE POINT. Every value below is also
; a default set in ABRPlayerController's constructor as an FSoftObjectPath, so the mapping
; contexts land with this section absent, empty, or misspelled. UObject::LoadConfig runs
; after the constructor, so what is written here still WINS — the ini remains the place to
; change a value; it is merely no longer the place a missing value kills the game.
;
; The history that bought that rule: this section was inert until 1 Aug 2026. UE only fills
; a property from a [/Script/Module.Class] section when the UPROPERTY carries `Config` and
; the UCLASS is declared `config=Game`, and ABRPlayerController had neither, so every line
; was read by nobody while appearing correct to every reader.
;
; The two lists mirror the First Person template's split one-to-one: DefaultMappingContexts
; on every platform, MobileExcludedMappingContexts only when not using touch. IMC_MouseLook
; belongs in the second and is NOT optional on desktop — IMC_Default carries no
; Mouse2D/MouseX mapping at all, so without it the player cannot turn.
;
; Paths are full object paths (Package.Object), which is what a TSoftObjectPtr parses.
; `+` APPENDS to the constructor's seed rather than replacing it; naming the same context
; twice is harmless (the controller de-duplicates before adding).
; ---------------------------------------------------------------------------
[/Script/Breachpoint.BRPlayerController]
InputConfig=/Game/Input/DA_InputConfig.DA_InputConfig
MouseLookAction=/Game/Input/Actions/IA_MouseLook.IA_MouseLook
DefaultMappingContextPriority=0

; ---------------------------------------------------------------------------
; ABRCharacter's five native verb actions.
;
; The template's binding shape — the pawn names its own actions — expressed lawfully: soft
; refs, not the template's hard UInputAction* UPROPERTYs filled from a Blueprint details
; panel. As above, each is ALSO a constructor default, so the pawn is controllable with
; this block deleted; the ini overrides and does not enable.
;
; There is exactly ONE binder now. The `bBindNativeVerbsFromInputConfig` switch that used
; to sit here — flipping these five verbs over to tag lookup through DA_InputConfig — is
; deleted along with its second binder. Ability verbs still route through DA_InputConfig;
; only the four native ones are named directly. See BRCharacter.h.
; ---------------------------------------------------------------------------
[/Script/Breachpoint.BRCharacter]
MoveAction=/Game/Input/Actions/IA_Move.IA_Move
LookAction=/Game/Input/Actions/IA_Look.IA_Look
MouseLookAction=/Game/Input/Actions/IA_MouseLook.IA_MouseLook
JumpAction=/Game/Input/Actions/IA_Jump.IA_Jump
CrouchAction=/Game/Input/Actions/IA_Crouch.IA_Crouch

; ---------------------------------------------------------------------------
; THE GAS STAGE GATE — the one line that reverts a GAS regression without a rebuild.
;
; WHAT THIS IS: how far the GAS integration is switched on, for the whole process. The plan it
; enforces is docs/GAS-INTEGRATION-ROADMAP.md, whose one rule is that every stage "defaults OFF,
; flips ON alone, and reverts in one edit". This is that edit.
;
; WHY IT IS AN INI LINE AND NOT A #define: a rebuild needs the editor closed (R36) and the founder
; is mid-playtest. Changing this line and restarting the editor costs a minute; a rebuild costs the
; session. Config is read at CDO construction, not per-PIE, so a RESTART is required — the same
; constraint documented for the PC block above and in PHASE2-RELAYER.md step 1.
;
; LEGAL VALUES, in order, lowest blast radius first. A stage means "at least this far": setting
; Weapons also enables everything below it.
;
;   Off              nothing GAS-side runs. The template, exactly as it plays today.  <-- DEFAULT
;   AttributesOnly   ASC init + GE_InitStats. Numbers exist; nothing reads them.
;   Granting         ability sets granted. Abilities exist; no input reaches them.
;   InputRouted      ability input tags reach the ASC. Abilities activate; most do nothing.
;   Sprint           the first ability with a visible effect.
;   Weapons          fire, reload, swap.
;   FullSandbox      melee, grenade, grapple.
;   Cues             FX layer last, because it is the only layer that cannot break gameplay.
;
; ONE STAGE PER TEST RUN. Two at once and a regression has two suspects — the exact hole
; PHASE2-RELAYER was dug to escape. A stage may only be entered when the one below it has a
; recorded PIE observation, and movement is the canary in every one of them: if WASD dies, the
; stage that just landed owns it, however unrelated it looks. Revert = set this back to Off.
;
; HOW TO TELL IT IS WORKING: every session prints ONE line at Warning, whatever the stage —
;   BRGas: stage = Off (Config/DefaultGame.ini)
; If that line is absent, the gate itself is broken and no stage above Off is trustworthy. It
; prints at Off too, on purpose: a silent gate is indistinguishable from a broken feature.
;
; NOT SETTABLE ON A BLUEPRINT. GasStage is UPROPERTY(Config) with no edit specifier, so it does not
; appear on BP_BRcharacter's details panel and cannot be serialised there. That is deliberate:
; PHASE2-RELAYER.md step 1 records that a Blueprint's saved property beats the ini-loaded C++ CDO,
; and this is the one switch that must never lose that fight.
;
; Markers: Source/Breachpoint/Core/BRCore.h:125             — EBRGasStage, the ordered stages.
;          Source/Breachpoint/Core/BRCore.h:199             — BRGas::IsStageEnabled, the gate.
;          Source/Breachpoint/Core/BRCore.cpp:50            — the CDO read + once-per-process cache.
;          Source/Breachpoint/Core/BRCore.cpp:93            — the startup announcer (prints at Off too).
;          Source/Breachpoint/Character/BRCharacter.h:182   — the property this line fills.
;          Source/Breachpoint/Character/BRCharacter.cpp:198 — the ONLY gated call site today; every
;                                                             other stage's hook is named, unwired,
;                                                             in the comment block above it.
; ---------------------------------------------------------------------------
GasStage=Off
