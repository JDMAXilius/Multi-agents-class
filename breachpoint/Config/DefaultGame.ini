; further down this file belongs to [/Script/BreachpointNext.BNBotController] — BN's bot,
; inert while BotSystem=AIB — so every AIB bot has been silently running the C++ default,
; Marine, and the founder's 25-Aug aggression tuning never reached them. Recorded rather
; than quietly "fixed": Marine IS the shipped default, so nothing was wrong, but the two
; keys look identical in a diff and only one of them does anything.
; One of Recruit / Marine / ODST / Spartan; an unknown name falls back to defaults, loudly.
;
; SPARTAN (founder, 29 Aug). This is the top rung on all six axes — Expert Movement, Aim,
; Grenade, Melee, Confidence and Teamwork — and several behaviours only EXIST up here:
; the juke (0.00 below Skilled) and, with it, the sharpest defensive hopping; the earliest
; melee recognition; and the tightest confidence read (misjudge amplitude 0.04 against
; Marine's 0.18, so a Spartan is rarely wrong about whether it is winning).
;
; It stays a change of ONE key on purpose. Every difference between the rungs is data in
; AIBTiers.cpp, so nothing in the brain, the tree or the tasks knows which tier it is
; running — which is exactly what makes flipping this safe.
;
; The reaction floor does NOT move: 0.20s is a module constant (FAIRPLAY F1), not a tier
; knob, so even a Spartan draws its latency ABOVE it. This makes the bots better, never
; superhuman.
