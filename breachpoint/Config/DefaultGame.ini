; -- ADS ZOOM ------------------------------------------------------------------------------
; The camera's own FOV is 90, so ADSFOV IS the zoom factor: 90/ADSFOV.
;
; It was 80 — a 1.125x change most players simply cannot see, which is why aiming read as
; "the gun moved up" rather than "I zoomed in" (founder, 29 Aug: increase the ADS zoom).
; 60 is 1.5x: unmistakably a zoom, and still an arena-rifle sight rather than a scope.
;
; BOTH anim instances carry the blend and BOTH must be set. They are SIBLINGS off
; UAnimInstance, not parent and child — UBNAnimInstance is the production spine and
; UBNLAnimInstance is the Lyra parent that ABP_Mannequin_Base actually runs. A value set on
; only one of them is a change that does nothing on the body you are looking through, and
; the two sections look identical in a diff.
;
; Lower is tighter: 55 is 1.64x, 50 is 1.8x and starts to feel like a marksman optic on a
; weapon that has no such sight. InterpSpeed is how fast it gets there, not how far.
[/Script/BreachpointNext.BNAnimInstance]
ADSCameraBlend=(ADSFOV=60.000000,InterpSpeed=18.000000)

[/Script/BreachpointNext.BNLAnimInstance]
ADSCameraBlend=(ADSFOV=60.000000,InterpSpeed=18.000000)
