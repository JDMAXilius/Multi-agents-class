SprintAction=/Game/Input/Actions/IA_Sprint.IA_Sprint

; UI stack wiring (CPP-AUDIT D1). Without this section RootLayoutClass resolves null,
; CreateLayoutForLocalPlayer early-returns, and every Show* entry point is unreachable — the
; entire UI stack is inert regardless of what compiles. Paths follow wbp_plan.py's ASSET_FOLDER
; law: an asset is born at its final path, so these lines are correct before and after the
; editor lane builds them (a set-but-unbuilt path resolves null and the same guard fires, per
; asset instead of per stack).
; DeathOverlayClass / CarnageReportClass are deliberately unset: neither screen has a PLAN
; entry yet, and a path invented here would be a guess wearing a config line.
[/Script/Breachpoint.BRUISettings]
RootLayoutClass=/Game/UI/Layouts/WBP_RootLayout.WBP_RootLayout_C
HUDLayoutClass=/Game/UI/Layouts/WBP_HUDLayout.WBP_HUDLayout_C
MainMenuScreenClass=/Game/UI/MainMenu/WBP_MainMenu.WBP_MainMenu_C
KillfeedEntryClass=/Game/UI/HUD/WBP_KillfeedEntryWidget.WBP_KillfeedEntryWidget_C
; Settings tier (BP78). These four are config rather than EditDefaultsOnly members on the
; screens because Tools/gen_ui/build_wbp.py writes widgets and widget properties and has NO
; way to author a CDO default on a generated Blueprint — so a soft class declared on the
; screen could only ever be filled in by a hand edit to a binary asset, which is exactly what
; law 7 and R37 exist to prevent. Set here, they are text and they diff.
; ConfirmModalClass is DELIBERATELY the same WBP_Modal_Warning the rest of the front end uses:
; it takes an FBRConfirmRequest payload, so "discard your changes?" and "steal this key?" are
; one class with two different sets of text, not two modals.
SettingsScreenClass=/Game/UI/Screens/WBP_Screen_Settings.WBP_Screen_Settings_C
KeyRemapScreenClass=/Game/UI/Screens/WBP_Modal_KeyRemap.WBP_Modal_KeyRemap_C
ConfirmModalClass=/Game/UI/Screens/WBP_Modal_Warning.WBP_Modal_Warning_C
SettingsRowClass=/Game/UI/Components/WBP_SettingsRow.WBP_SettingsRow_C

; Third-party notices MUST ship inside the packaged game — the Lucide icon set is ISC, which
; requires its copyright and permission notice to appear in all copies. Staging the file is what
; discharges that obligation; THIRD-PARTY-NOTICES.md at the repo root is only the record.
; Content/Legal/ holds no .uasset, so it needs explicit staging: UFS keeps it inside the pak
; (readable via FFileHelper at runtime by the credits screen), and the non-UFS copy puts a plain
; file next to the executable for players and for storefront review.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsUFS=(Path="Content/Legal")
+DirectoriesToAlwaysStageAsNonUFS=(Path="Content/Legal")

; ---------------------------------------------------------------------------------------
; The SECOND [/Script/Breachpoint.BRUISettings] section that used to sit here is GONE.
; Two sections with the same header is not an error UE reports - later keys simply win -
; so the file read as if it had one owner while carrying two, and the halves disagreed
; about MainMenuScreenClass. Folded into the single section above, 3 Aug 2026 (BP72).
;
; The disagreement is now MOOT rather than resolved-by-argument: the block above set
; MainMenuScreenClass while this one said it "is deliberately UNSET ... a path to a
; non-existent asset would fail at load". That caution was correct when written and is
; obsolete: Content/UI/MainMenu/WBP_MainMenu.uasset now EXISTS (FE_Play 1:1),
; so the path resolves.
; ---------------------------------------------------------------------------------------

; The soft ROW/TAB classes each host resolves at runtime (BP72 step 5). Every one of these
; was null until 3 Aug 2026, which is why a nav bar drew no tabs and a roster drew no rows
; even once their panels existed: the host creates its children from these classes and a
; null class creates nothing, silently and correctly.
[/Script/Breachpoint.BRNavBar]
TabWidgetClass=/Game/UI/Components/WBP_NavTab.WBP_NavTab_C

[/Script/Breachpoint.BRRosterPanel]
RowWidgetClass=/Game/UI/Components/WBP_RosterRow.WBP_RosterRow_C

