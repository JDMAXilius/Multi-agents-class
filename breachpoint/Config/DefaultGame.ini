; THE DASH (founder, 29 Aug) — key 2, beside the grapple's 1.
;
; A thrust, not a sprint: it launches along the MOVEMENT INPUT, so holding strafe-left and
; pressing 2 dodges left. That is the whole point — a forward-only dash would just be a
; faster sprint. With no movement held it goes camera-forward so the key is never dead.
;
; DISTANCE IS THE WINDOW, NOT THE SPEED — and the first pass got this wrong. Measured
; against the character's real values (ground friction 8 x factor 2, braking 2048 uu/s^2),
; a 1200 launch with friction live travels 39uu and is dead in 0.15s; even 3200 reaches
; only 124uu. The ability now suppresses friction for DashDuration, so the dash covers
; roughly speed x duration and these two numbers finally mean what they say.
;
; 2000 x 0.25s = ~500uu = 5m. A real repositioning dodge, and still under a third of the
; grapple's 2200uu reach, so the two mobility verbs stay distinct.
DashSpeedUU=2000
DashDuration=0.25
CooldownDuration=3.0
; Air dashing ON: a thrust that stops working the moment you leave the ground is a thrust
; you cannot use to escape whatever knocked you off it.
bAllowInAir=True

; -- POLISH -------------------------------------------------------------------------------
; FOUR montages, not one. The FPS template ships all four directions on SK_Mannequin (the
; character's own skeleton, FullBody slot) and the ability picks by the dominant axis in the
; PAWN'S frame. Playing the forward animation while the body slides sideways is worse than
; playing nothing: it tells the player the game is lying about the direction.
MontageForward=/Game/FPSTemplate/Demo/Characters/Heroes/Mannequin/Animations/Actions/AM_MM_Dash_Forward.AM_MM_Dash_Forward
MontageBackward=/Game/FPSTemplate/Demo/Characters/Heroes/Mannequin/Animations/Actions/AM_MM_Dash_Backward.AM_MM_Dash_Backward
MontageLeft=/Game/FPSTemplate/Demo/Characters/Heroes/Mannequin/Animations/Actions/AM_MM_Dash_Left.AM_MM_Dash_Left
MontageRight=/Game/FPSTemplate/Demo/Characters/Heroes/Mannequin/Animations/Actions/AM_MM_Dash_Right.AM_MM_Dash_Right
; The camera is a CLASS, not an asset — nothing to author, nothing to leave unset. It rolls
; toward a lateral dash and stays level on a straight one, because a roll on a forward dash
; reads as a stumble rather than a bank.
CameraShake=/Script/BreachpointNext.BNDashCameraShake
; Rumble is DYNAMIC force feedback: no asset, so the dash has weight in the hands the very
; first time it is pressed. Both motors — a dash is a shove, not a trigger click.
HapticIntensity=0.55
HapticDuration=0.16

