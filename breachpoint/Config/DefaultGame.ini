; TESTING, 22 Aug 2026 — 3 so a round ends in a kill or two and the win/lose screens are
; actually reachable. Ship value was 25; this is the line to put back, not the C++ default.
; 3 -> 7 (founder, 25 Aug). With 8 players and Spartan bots a round of 3 ended almost
; immediately - 10 eliminations were logged in a single 55s sample.
; AIB11 (Phase 6 Hill proof, 26 Aug 2026). ScoreLimit was raised 7 -> 25 for the hill runs
; and RESTORED to 7 here; bHillEnabled is back to False (slayer is the shipped default).
; To re-run the objective proof: set the bHillEnabled line below to True and raise
