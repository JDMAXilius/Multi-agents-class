; NOTE, 9 Aug 2026: both ABPs are 34 KB class stubs - no state machine, no ALI_ItemAnimLayers
; interface - so anything parented to ABRFPSCharacter T-poses in PIE. Not a config defect and
; not fixable here: BeginPlay assigns these correctly and the assets have no graph to play.
