; SIGHT. Lowered from the C++ defaults (2500 / 3000) because at those numbers a bot could see
; most of BR_Arena01 from where it stood: every bot always had a target, so the tree never left
; Engage, Search was unreachable, and the bots never roamed. 1200/1500 is roughly one arena
; segment — bots lose each other around corners, which is what makes hunting a behaviour rather
; than a dead branch. These are the FOUNDER'S numbers now; the C++ values remain the fallback.
SightRadius=1200.0
LoseSightRadius=1500.0
PeripheralVisionAngleDegrees=70.0

