; contract_gap BP82-9. ABPCharacter assigns no SkeletalMesh (law 3 — no hard asset refs in
; C++), so the meshes live on the R26 BP child below and the bare C++ pawn spawns invisible.
; ABPGameMode reads this in GetDefaultPawnClassForController; unset falls back to the C++ class
; with a warning. Note the _C suffix — this is a class ref, not an object ref.
; 11 Aug 2026: repointed at BP_FPSCharacter, the R26 child of AMyCharacter.
;
; It used to name BP_FPST_Character_C, a copy of the TEMPLATE character parented to
; ABPFPSCharacter. That class is not an AMyCharacter, so every standalone run spawned a pawn
; that ran NONE of the ported C++ — no weapon spawn, no fire chain, no anim-interface messages.
; A standalone log with zero "MyCharacter READY:" lines in it is this bug, and that line exists
; precisely so the absence is legible rather than looking like success.
;
; BP_FPSCharacter carries the same component tree (capsule, SKM_Manny_Y, FPSCamera, CameraBoom,
; FollowCamera, Arrow_MeleeTraceStart, the nine BPC_FPST_*), synced 1:1 from the template by
; mcp-bp/sync_character_components.py, which is why its parent class creates no components.
; Revert to /Game/Characters/BP.BP_C for the ABPCharacter pawn, or to
; /Game/Characters/BP_FPST_Character.BP_FPST_Character_C for the pre-port template behaviour;
; nothing else in this file has to change, because those classes read the same input actions
; from their own sections below.
[/Script/Breachpoint.BPGameMode]
