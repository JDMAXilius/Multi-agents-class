; TEAM COLOURS on the 3P body (the mannequin everyone else sees). Soft paths, law 3 — the
; character holds no hard material reference and no ConstructorHelpers.
;
; VIEWER-RELATIVE, not absolute Red-team/Blue-team: BN16's ruling is one hue one meaning —
; blue is your side, red is THREAT — and the scoreboard, killfeed and grenade tints all
; already obey it. Colouring your own team-mates red because the match called them "Red"
; would bend the one rule that block says is held, not bent.
;
; SLOT NUMBERING IS A TRAP, and the reason these are keyed by slot NAME below: SKM_Manny's
; torso slot carries MI_Manny_02 and its head/legs slot carries MI_Manny_01 — the material
; numbers run OPPOSITE to the slot order. Pairing them by index swaps the two and the result
; reads as a broken texture, not as a wrong pairing.
;
; Nothing here is authored art: these four instances ship with the FPS template. Leave a key
; empty and that slot simply keeps the material the mesh shipped with (which is also what an
; unassigned team and every FFA match get — an honest "no side", never a wrong one).
